name: Debug RSS Feed

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: 'شناسه کانال (UC...)'
        required: true
        default: 'UCat6bC0Wrqq9Bcq7EkH_yQw'
      keyword:
        description: 'کلیدواژه'
        required: true
        default: 'اخبار نیمروزی'
      start_time:
        description: 'ساعت شروع (HH:MM)'
        required: false
        default: '15:00'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run debug script
        run: python debug_youtube_rss.py "${{ github.event.inputs.channel_id }}" "${{ github.event.inputs.keyword }}" "${{ github.event.inputs.start_time }}"
