name: ⬇️ Download from Catalog Issue

on:
  issue_comment:
    types: [created]

jobs:
  download:
    if: >
      contains(github.event.comment.body, '/download') &&
      github.event.issue.title == '📺 Channel Catalog – Download'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Parse /download command
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          NUM=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+[0-9]+' | awk '{print $2}' | head -1)
          if [ -z "$NUM" ]; then
            echo "❌ فرمت صحیح نیست. از این دستور استفاده کنید:"
            echo "/download <شماره>"
            echo "مثال: /download 5"
            exit 1
          fi
          echo "num=$NUM" >> $GITHUB_OUTPUT

      - name: Load catalog index
        id: catalog
        run: |
          if [ ! -f data/catalog_index.json ]; then
            echo "❌ data/catalog_index.json پیدا نشد. اول Full Diagnostic را اجرا کنید."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          num = int(os.environ["NUM"])
          with open("data/catalog_index.json", encoding="utf-8") as f:
              data = json.load(f)
          # support list or dict with items
          items = data if isinstance(data, list) else data.get("items") or data.get("entries") or []
          if num < 1 or num > len(items):
              print(f"❌ شماره {num} خارج از محدوده (1..{len(items)})")
              raise SystemExit(1)
          item = items[num - 1]
          print(json.dumps(item, ensure_ascii=False))
          PY
        env:
          NUM: ${{ steps.parse.outputs.num }}
