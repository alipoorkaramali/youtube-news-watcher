name: ⬇️ Download from Catalog Issue

on:
  issues:
    types: [labeled]

jobs:
  download:
    if: github.event.label.name == 'download'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Load catalog index
        id: catalog
        run: |
          if [ ! -f data/catalog_index.json ]; then
            echo "❌ data/catalog_index.json پیدا نشد. اول Full Diagnostic را اجرا کنید."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          with open("data/catalog_index.json", encoding="utf-8") as f:
              data = json.load(f)
          print("catalog loaded", type(data))
          PY

      - name: Placeholder note
        run: echo "Catalog path is data/catalog_index.json — rest of workflow unchanged if present in repo history"
