name: YouTube Multi-Watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:          # ← این خط باعث می‌شود دکمهٔ "Run workflow" نشان داده شود

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python youtube_scanner.py

      - name: Commit logs and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/new_videos.txt cache/
          git diff --staged --quiet || (git commit -m "Update logs & cache" && git push)
