name: Daily Reset new_videos.txt

on:
  schedule:
    - cron: '0 0 * * *'   # هر روز ساعت 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure logs directory and clear file
        run: |
          mkdir -p logs                     # اگر پوشه logs نباشد، می‌سازد
          true > logs/new_videos.txt         # فایل را خالی می‌کند (در صورت عدم وجود، فایل خالی می‌سازد)

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Daily log reset'
          file_pattern: 'logs/new_videos.txt'
