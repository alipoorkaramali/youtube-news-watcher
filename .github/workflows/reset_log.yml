name: Daily Reset new_videos🧹

on:
  schedule:
    - cron: '45 20 * * *'   # 20:45 UTC = 00:15 IRST (12:15 AM)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure logs directory and clear file
        run: |
          mkdir -p logs
          true > logs/new_videos.txt

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Daily log reset at 12:15 AM IRST'
          file_pattern: 'logs/new_videos.txt'
