# ================================================================
# نام: Daily Reset new_videos 🧹
# هدف: پاک‌سازی خودکار کش و فایل ویدیوهای جدید در ابتدای هر روز
#       تا اسکنر روز بعد از یک وضعیت کاملاً خالی شروع کند.
# ================================================================

name: Daily Reset new_videos🧹

# ================================================================
# زمان‌بندی اجرا:
#   - هر روز ساعت 20:45 UTC معادل 00:15 IRST (۱۲:۱۵ بامداد ایران)
#   - قابلیت اجرای دستی برای دیباگ یا ریست فوری
# ================================================================
on:
  schedule:
    - cron: '45 20 * * *'   # 20:45 UTC = 00:15 IRST
  workflow_dispatch:        # اجرای دستی از طریق تب Actions

# ================================================================
# سطح دسترسی: اجازه‌ی commit به مخزن برای ذخیره‌ی تغییرات
# ================================================================
permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # مرحله ۱: دریافت مخزن (برای دسترسی به فایل‌ها)
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # مرحله ۲: پاک‌سازی کامل کش و لاگ‌ها
      #   - پاک کردن فایل new_videos.txt (با دستور true > ...)
      #   - حذف تمام محتویات پوشه‌ی cache (شامل states و هر چیز دیگر)
      #   - ایجاد مجدد پوشه‌های خالی برای جلوگیری از خطا
      #   - (اختیاری) نوشتن یک فایل لاگ از زمان ریست برای پیگیری
      # ------------------------------------------------------------
      - name: Clear logs and cache
        run: |
          # اطمینان از وجود پوشه‌ی logs
          mkdir -p logs
          
          # خالی کردن فایل جدیدترین ویدیوها (بدون حذف خود فایل)
          true > logs/new_videos.txt
          
          # حذف کامل محتویات کش (states و هر فایل موقت دیگر)
          rm -rf cache/*  2>/dev/null || true
          
          # ایجاد مجدد پوشه‌ی cache برای استفاده‌ی بعدی
          mkdir -p cache
          
          # (اختیاری) ثبت زمان ریست برای پیگیری در صورت نیاز
          echo "ریست روزانه در تاریخ $(date) انجام شد." > cache/last_reset.log

      # ------------------------------------------------------------
      # مرحله ۳: کامیت و ارسال تغییرات به مخزن
      #   - تمام تغییرات (پاک‌سازی‌ها) را commit کرده و به branch اصلی push می‌کند.
      # ------------------------------------------------------------
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Daily reset: clear logs & cache at 12:15 AM IRST'
          file_pattern: 'logs/ cache/'
