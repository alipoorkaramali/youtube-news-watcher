name: Daily Reset new_videos.txt

on:
  schedule:
    - cron: '0 0 * * *'   # هر روز ساعت 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clear new_videos.txt
        run: truncate -s 0 new_videos.txt   # یا : > new_videos.txt

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Daily log reset'
          file_pattern: 'new_videos.txt'
