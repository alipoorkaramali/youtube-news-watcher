name: YouTube Multi-Watcher v.1🔎📽️📼

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Run scanner
        run: python run_checker.py
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Confirm trigger sent (optional)
        run: |
          if [ -f logs/new_videos.txt ] && grep -q "✅ درخواست دانلود با موفقیت به GitHub ارسال شد" logs/new_videos.txt; then
            echo "✅ تریگر دانلودر با موفقیت ارسال شد."
          else
            echo "⚠️ تریگر دانلودر ارسال نشد یا ویدیوی جدیدی یافت نشد."
          fi

      - name: Commit logs and cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'بروزرسانی لاگ‌ها و کش و ویدیوهای جدید'
          file_pattern: 'logs/ cache/'
