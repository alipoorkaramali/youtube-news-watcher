name: YouTube Multi-Watcher v.1🔎📽️📼

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pre-check if any item needs scanning
        id: precheck
        run: |
          OUTPUT=$(python pre_check.py)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "✅"; then
            echo "continue=true" >> $GITHUB_OUTPUT
          else
            echo "continue=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.precheck.outputs.continue == 'true'
        run: |
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Run scanner
        if: steps.precheck.outputs.continue == 'true'
        run: python run_checker.py
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Confirm trigger sent
        if: steps.precheck.outputs.continue == 'true'
        run: |
          if [ -f logs/new_videos.txt ] && grep -q "✅ درخواست دانلود با موفقیت به GitHub ارسال شد" logs/new_videos.txt; then
            echo "✅ تریگر دانلودر با موفقیت ارسال شد."
          else
            echo "⚠️ تریگر دانلودر ارسال نشد یا ویدیوی جدیدی یافت نشد."
          fi

      - name: Commit logs and cache
        if: steps.precheck.outputs.continue == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'بروزرسانی لاگ‌ها و کش و ویدیوهای جدید'
          file_pattern: 'logs/ cache/'
