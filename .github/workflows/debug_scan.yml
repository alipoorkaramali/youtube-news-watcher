name: Full Diagnostic

on:
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'شناسه کانال یوتیوب (برای تست RSS)'
        required: false
        default: 'UCat6bC0Wrqq9Bcq7EkH_yQw'
      soundcloud_url:
        description: 'لینک پلی‌لیست یا کاربر ساندکلاد (برای تست)'
        required: false
        default: 'https://soundcloud.com/iranintl'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests soundcloud-lib
          python -c "import sclib; print('soundcloud-lib imported successfully')"
          python -c "import requests; print('requests imported')"

      - name: Test YouTube RSS directly (curl)
        if: github.event.inputs.youtube_channel_id != ''
        run: |
          echo "=== Testing YouTube RSS: channel_id=${{ github.event.inputs.youtube_channel_id }} ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            "https://www.youtube.com/feeds/videos.xml?channel_id=${{ github.event.inputs.youtube_channel_id }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ RSS feed is accessible."
          elif [ "$STATUS" -eq 404 ]; then
            echo "❌ Channel not found (404). The channel ID is likely invalid or the channel does not exist."
          else
            echo "⚠️ Unexpected status: $STATUS"
          fi

      - name: Test YouTube RSS with Python (detailed)
        if: github.event.inputs.youtube_channel_id != ''
        run: |
          python << 'EOF'
          import requests, xml.etree.ElementTree as ET, os

          channel_id = os.environ.get('CHANNEL_ID', '')
          if not channel_id:
              channel_id = "${{ github.event.inputs.youtube_channel_id }}"
          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          }
          print(f"Requesting {url}")
          try:
              r = requests.get(url, headers=headers, timeout=30)
              print(f"Status: {r.status_code}")
              if r.status_code == 200:
                  root = ET.fromstring(r.content)
                  ns = {'': 'http://www.w3.org/2005/Atom'}
                  entries = root.findall('entry', ns)
                  print(f"✅ Number of entries: {len(entries)}")
                  for i, entry in enumerate(entries[:5]):
                      title = entry.find('title', ns).text.strip()
                      link = entry.find('link', ns).attrib['href']
                      pub = entry.find('published', ns).text
                      print(f"  {i+1}. {title}")
                      print(f"     Link: {link}")
                      print(f"     Published: {pub}")
              elif r.status_code == 404:
                  print("❌ Channel not found (404). Check the channel ID.")
              else:
                  print(f"⚠️ Unexpected status: {r.status_code}")
                  print("Response preview:", r.text[:300])
          except Exception as e:
              print("Error:", str(e))
          EOF
        env:
          CHANNEL_ID: ${{ github.event.inputs.youtube_channel_id }}

      - name: Test SoundCloud library
        if: github.event.inputs.soundcloud_url != ''
        run: |
          python << 'EOF'
          from sclib import SoundcloudAPI, Playlist, User
          import traceback, os

          url = os.environ.get('SC_URL', '').strip()
          if not url:
              url = "${{ github.event.inputs.soundcloud_url }}"
          print(f"Testing SoundCloud URL: {url}")
          try:
              api = SoundcloudAPI()
              obj = api.resolve(url)
              if isinstance(obj, Playlist):
                  print("✅ Playlist found!")
                  print(f"   Title: {obj.title}")
                  tracks = list(obj.tracks)
                  print(f"   Number of tracks: {len(tracks)}")
                  for i, track in enumerate(tracks[:5]):
                      print(f"   {i+1}. {track.title}")
              elif isinstance(obj, User):
                  print("✅ User profile found (not a playlist).")
                  print(f"   Username: {obj.username}")
                  tracks = list(obj.tracks)
                  print(f"   Recent tracks (up to 5):")
                  for i, track in enumerate(tracks[:5]):
                      print(f"   {i+1}. {track.title}")
              else:
                  print(f"⚠️ Resolved to unknown type: {type(obj)}")
          except Exception:
              print("❌ Error occurred while testing SoundCloud:")
              traceback.print_exc()
          EOF
        env:
          SC_URL: ${{ github.event.inputs.soundcloud_url }}

      - name: Run original scanner (from watchlist.json)
        env:
          PYTHONFAULTHANDLER: 1
        run: |
          python -u youtube_scanner.py
