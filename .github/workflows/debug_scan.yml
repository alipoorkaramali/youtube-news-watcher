name: Full Diagnostic

on:
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'شناسهٔ کانال یوتیوب (برای تست RSS)'
        required: false
        default: 'UCHZk9MrT3DGWmVqdsj5y0EA'          # معتبر از watchlist شما
      soundcloud_url:
        description: 'لینک پلی‌لیست یا کاربر ساندکلاد'
        required: false
        default: 'https://soundcloud.com/iranintl'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests & yt‑dlp
        run: |
          pip install requests
          # از قبل در image هست، اما برای اطمینان:
          pip install -U yt-dlp

      - name: 📋 Show current watchlist.json
        run: |
          echo "=== Contents of watchlist.json ==="
          cat watchlist.json
          echo ""
          echo "👆 Copy any channel ID or SoundCloud URL and paste when triggering manually."

      # ---------- تست RSS یوتیوب ----------
      - name: Quick YouTube RSS check (curl)
        if: github.event.inputs.youtube_channel_id != ''
        run: |
          echo "=== Testing channel: ${{ github.event.inputs.youtube_channel_id }} ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            "https://www.youtube.com/feeds/videos.xml?channel_id=${{ github.event.inputs.youtube_channel_id }}")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ RSS feed reachable."
          elif [ "$STATUS" -eq 404 ]; then
            echo "❌ Channel not found (404). ID is probably wrong."
          else
            echo "⚠️ Unexpected status: $STATUS"
          fi

      - name: Detailed YouTube RSS (Python)
        if: github.event.inputs.youtube_channel_id != ''
        run: |
          python << 'EOF'
          import requests, xml.etree.ElementTree as ET, os

          channel_id = "${{ github.event.inputs.youtube_channel_id }}"
          url = f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          }
          print(f"Requesting {url}")
          try:
              r = requests.get(url, headers=headers, timeout=30)
              print(f"Status: {r.status_code}")
              if r.status_code == 200:
                  root = ET.fromstring(r.content)
                  ns = {'': 'http://www.w3.org/2005/Atom'}
                  entries = root.findall('entry', ns)
                  print(f"✅ {len(entries)} video(s) found")
                  for i, entry in enumerate(entries[:5]):
                      title = entry.find('title', ns).text.strip()
                      link = entry.find('link', ns).attrib['href']
                      pub = entry.find('published', ns).text
                      print(f"  {i+1}. {title}")
                      print(f"     Link: {link}")
                      print(f"     Published: {pub}")
              elif r.status_code == 404:
                  print("❌ Channel not found (404).")
              else:
                  print(f"⚠️ Status {r.status_code}: {r.text[:300]}")
          except Exception as e:
              print("Error:", str(e))
          EOF

      # ---------- تست ساندکلاد (با yt‑dlp، مانند اسکنر اصلی) ----------
      - name: Test SoundCloud with yt‑dlp
        if: github.event.inputs.soundcloud_url != ''
        run: |
          URL="${{ github.event.inputs.soundcloud_url }}"
          echo "Fetching playlist: $URL"
          yt-dlp --flat-playlist -J --no-warnings "$URL" > /tmp/sc.json 2>/dev/null
          if [ $? -eq 0 ]; then
              python << 'EOF'
              import json
              with open('/tmp/sc.json') as f:
                  data = json.load(f)
              entries = data.get('entries', [])
              print(f"✅ Number of tracks in playlist: {len(entries)}")
              for i, e in enumerate(entries[:5]):
                  print(f"  {i+1}. {e.get('title')}")
                  print(f"     URL: {e.get('webpage_url') or e.get('url')}")
              EOF
          else
              echo "❌ Could not fetch playlist. Check the URL."
          fi

      # ---------- اجرای اسکنر اصلی ----------
      - name: Run original scanner
        env:
          PYTHONFAULTHANDLER: 1
        run: |
          python -u youtube_scanner.py
