name: Full Diagnostic🩺🧑‍⚕️

on:
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'YouTube Channel ID (RSS)'
        required: false
        default: 'UCHZk9MrT3DGWmVqdsj5y0EA'
      soundcloud_url:
        description: 'SoundCloud URL (playlist or user)'
        required: false
        default: 'https://soundcloud.com/iranintl'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install requests sclib yt-dlp

      - name: Run debug_youtube_rss.py and save output
        env:
          # اگر اسکریپت از متغیر محیطی یا فایل watchlist.json استفاده می‌کند،
          # می‌توانیم watchlist.json را موقتاً بازنویسی کنیم تا ورودی را بگیرد.
          # برای سادگی، watchlist.json را با یک آیتم موقت می‌سازیم.
        run: |
          # ساخت watchlist.json موقت برای تشخیص تنها یک کانال/پلی‌لیست
          cat > watchlist_temp.json << EOF
          [
            {
              "platform": "youtube",
              "channel_id": "${{ github.event.inputs.youtube_channel_id }}",
              "title_keyword": ""
            },
            {
              "platform": "soundcloud_playlist",
              "channel_id": "${{ github.event.inputs.soundcloud_url }}",
              "title_keyword": ""
            }
          ]
          EOF
          # پشتیبان گرفتن از watchlist اصلی (اگر وجود دارد)
          if [ -f watchlist.json ]; then
            mv watchlist.json watchlist.json.bak
          fi
          mv watchlist_temp.json watchlist.json

          # اجرای اسکریپت و گرفتن خروجی
          python debug_youtube_rss.py 2>&1 | tee diagnostic_results.txt

          # بازیابی watchlist اصلی
          if [ -f watchlist.json.bak ]; then
            mv watchlist.json.bak watchlist.json
          else
            rm watchlist.json
          fi

      - name: Run scanner and append output
        run: |
          if [ -f "youtube_scanner.py" ]; then
            echo -e "\n\n=== Scanner Output (youtube_scanner.py) ===\n" >> diagnostic_results.txt
            python youtube_scanner.py 2>&1 >> diagnostic_results.txt || echo "Scanner failed" >> diagnostic_results.txt
            if [ -f "logs/new_videos.txt" ]; then
              echo -e "\n=== new_videos.txt ===\n" >> diagnostic_results.txt
              cat logs/new_videos.txt >> diagnostic_results.txt
            fi
          else
            echo "youtube_scanner.py not found" >> diagnostic_results.txt
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostic_results.txt
          git diff --staged --quiet || (git commit -m "Update diagnostic results [skip ci]" && git push)