name: Full Diagnostic🩺🧑‍⚕️

on:
  schedule:
    # هر ۴ ساعت یک‌بار: ۶، ۱۰، ۱۴، ۱۸، ۲۲ (به وقت UTC)
    - cron: '0 6,10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'New YouTube Channel ID (optional — leave empty to use saved list only)'
        required: false
        default: ''
      soundcloud_url:
        description: 'New SoundCloud URL (optional — leave empty to use saved list only)'
        required: false
        default: ''
      save_to_list:
        description: 'Save the new channel(s) above into saved_channels.txt'
        required: false
        type: boolean
        default: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install requests soundcloud-lib
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Run diagnostic script
        env:
          EXTRA_YOUTUBE: ${{ github.event.inputs.youtube_channel_id || '' }}
          EXTRA_SOUNDCLOUD: ${{ github.event.inputs.soundcloud_url || '' }}
          SAVE_TO_LIST: ${{ github.event.inputs.save_to_list || false }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python debug_youtube_rss.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostic_results.txt channel_catalog.md saved_channels.txt catalog_index.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update diagnostic results + channel catalog [skip ci]"
            git push
          fi
