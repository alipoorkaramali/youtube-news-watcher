name: Full Diagnostic

on:
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'شناسهٔ کانال یوتیوب (برای تست RSS)'
        required: false
        default: 'UCat6bC0Wrqq9Bcq7EkH_yQw'
      soundcloud_url:
        description: 'لینک پلی‌لیست یا کاربر ساندکلاد'
        required: false
        default: 'https://soundcloud.com/iranintl'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Display watchlist
        run: |
          echo "=== watchlist.json ==="
          cat watchlist.json
          echo "Use these IDs/URLs as inputs."

      # ---------- یوتیوب (با کوکی و User‑Agent) ----------
      - name: Test YouTube RSS (with cookies)
        if: github.event.inputs.youtube_channel_id != ''
        run: |
          python -c "
          import requests, xml.etree.ElementTree as ET, os
          from http.cookiejar import MozillaCookieJar

          cid = '${{ github.event.inputs.youtube_channel_id }}'
          url = f'https://www.youtube.com/feeds/videos.xml?channel_id={cid}'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          }
          cookies = {}
          if os.path.exists('cookies.txt'):
              try:
                  cj = MozillaCookieJar('cookies.txt')
                  cj.load(ignore_discard=True, ignore_expires=True)
                  cookies = {c.name: c.value for c in cj if '.youtube.com' in c.domain}
              except: pass

          try:
              r = requests.get(url, headers=headers, cookies=cookies, timeout=30)
              print(f'Status: {r.status_code}')
              if r.status_code == 200:
                  root = ET.fromstring(r.content)
                  ns = {'': 'http://www.w3.org/2005/Atom'}
                  entries = root.findall('entry', ns)
                  print(f'✅ {len(entries)} videos found')
                  for i, e in enumerate(entries[:5]):
                      title = e.find('title', ns).text.strip()
                      link = e.find('link', ns).attrib['href']
                      pub = e.find('published', ns).text
                      print(f'  {i+1}. {title}')
                      print(f'     {link}')
              elif r.status_code == 404:
                  print('❌ Channel not found (404)')
              else:
                  print(f'⚠️ {r.status_code}: {r.text[:200]}')
          except Exception as ex:
              print(f'Error: {ex}')
          "

      # ---------- ساندکلاد (با yt‑dlp) ----------
      - name: Test SoundCloud (via yt‑dlp)
        if: github.event.inputs.soundcloud_url != ''
        run: |
          yt-dlp --flat-playlist -J "${{ github.event.inputs.soundcloud_url }}" > sc.json 2>/dev/null && \
          python -c "
          import json
          with open('sc.json') as f:
              data = json.load(f)
          entries = data.get('entries', [])
          print(f'✅ {len(entries)} tracks found')
          for i, e in enumerate(entries[:5]):
              print(f'{i+1}. {e.get(\"title\")} - {e.get(\"webpage_url\") or e.get(\"url\")}')
          " || echo "❌ Could not fetch playlist"

      - name: Run original scanner
        run: python -u youtube_scanner.py
