name: Full Diagnostic

on:
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'شناسهٔ کانال یوتیوب (RSS)'
        required: false
        default: 'UCHZk9MrT3DGWmVqdsj5y0EA'
      soundcloud_url:
        description: 'لینک ساندکلاد (پلی‌لیست یا کاربر)'
        required: false
        default: 'https://soundcloud.com/iranintl'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نمایش فایل watchlist.json
        run: cat watchlist.json

      - name: نصب نیازمندی‌ها (Python + yt‑dlp)
        run: |
          pip install requests
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      # ===================== تست یوتیوب =====================
      - name: 🎥 تست RSS یوتیوب (با تلاش مجدد)
        if: github.event.inputs.youtube_channel_id != ''
        run: |
          python -c "
          import requests, time, os, xml.etree.ElementTree as ET
          from http.cookiejar import MozillaCookieJar

          cid = '${{ github.event.inputs.youtube_channel_id }}'
          url = f'https://www.youtube.com/feeds/videos.xml?channel_id={cid}'
          headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          }
          cookies = {}
          if os.path.exists('cookies.txt'):
            try:
              cj = MozillaCookieJar('cookies.txt')
              cj.load(ignore_discard=True, ignore_expires=True)
              cookies = {c.name: c.value for c in cj if '.youtube.com' in c.domain}
            except: pass

          for attempt in range(3):
            try:
              r = requests.get(url, headers=headers, cookies=cookies, timeout=30)
              print(f'Attempt {attempt+1}, status: {r.status_code}')
              if r.status_code == 200:
                root = ET.fromstring(r.content)
                ns = {'': 'http://www.w3.org/2005/Atom'}
                entries = root.findall('entry', ns)
                print(f'✅ {len(entries)} video(s) found')
                for i, e in enumerate(entries[:5]):
                  title = e.find('title', ns).text.strip()
                  link = e.find('link', ns).attrib['href']
                  print(f'{i+1}. {title}  ({link})')
                break
              elif r.status_code in (403, 429, 500):
                print('⏳ Rate-limited or server error, waiting 15s...')
                time.sleep(15)
              elif r.status_code == 404:
                print('❌ Channel not found (404)')
                break
              else:
                print(f'⚠️ Unexpected status: {r.status_code}')
                break
            except Exception as e:
              print(f'Error: {e}')
              time.sleep(10)
          else:
            print('❌ Failed after 3 attempts – likely rate limiting.')
          "

      # ===================== تست ساندکلاد (با yt‑dlp) =====================
      - name: ☁️ تست پلی‌لیست ساندکلاد (yt‑dlp)
        if: github.event.inputs.soundcloud_url != ''
        run: |
          yt-dlp --flat-playlist -J --no-warnings "${{ github.event.inputs.soundcloud_url }}" > sc.json 2>/dev/null
          if [ $? -eq 0 ]; then
            python << 'EOF'
import json
with open('sc.json') as f:
    data = json.load(f)
entries = data.get('entries', [])
print(f'✅ {len(entries)} tracks found')
for i, e in enumerate(entries[:5]):
    print(f'{i+1}. {e.get("title")} - {e.get("webpage_url") or e.get("url")}')
EOF
          else
            echo "❌ Could not fetch playlist (blocked or invalid URL)"
          fi

      # ===================== اجرای اسکنر اصلی =====================
      - name: اجرای اسکنر اصلی با لاگ کامل
        run: |
          python -u youtube_scanner.py
          if [ -f "logs/new_videos.txt" ]; then
            echo "--- محتوای logs/new_videos.txt ---"
            cat "logs/new_videos.txt"
          else
            echo "--- logs/new_videos.txt پیدا نشد ---"
          fi
