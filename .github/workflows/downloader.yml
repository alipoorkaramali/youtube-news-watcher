name: YouTube Video Downloader

on:
  schedule:
    - cron: '*/30 * * * *'   # هر ۳۰ دقیقه
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ---------- حیاتی: نصب Node.js برای حل چالش JavaScript ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------- نصب پکیج‌های پایتون ----------
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install yt-dlp curl-cffi

      # ---------- بازیابی کوکی‌ها از Secret ----------
      - name: Prepare cookies
        env:
          YT_COOKIE: ${{ secrets.YT_COOKIE }}
        run: |
          if [ -n "$YT_COOKIE" ]; then
            echo "$YT_COOKIE" > cookies.txt
            echo "✅ کوکی ذخیره شد."
          else
            echo "⚠️ Secret یافت نشد. بدون کوکی ادامه می‌دهیم."
          fi

      # ---------- ۱۵ دقیقه صبر ----------
      - name: Wait 15 minutes for video processing
        run: sleep 900

      # ---------- اجرای اسکریپت دانلود ----------
      - name: Download videos
        run: python3 youtube_downloader.py

      # ---------- ذخیره تغییرات ----------
      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git diff --staged --quiet || (git commit -m "Add downloaded media" && git push)
