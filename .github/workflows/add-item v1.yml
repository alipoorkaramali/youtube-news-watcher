name: Add Item to Watchlist 📝

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        type: choice
        options:
          - youtube
          - soundcloud
      channel_id:
        description: 'YouTube channel ID or SoundCloud URL'
        required: true
      title_keyword:
        description: 'Title keyword to match'
        required: true
      start_time_iran:
        description: 'Start time Iran (HH:MM)'
        required: true
        default: '18:00'
      check_every_minutes:
        description: 'Check interval (minutes)'
        required: false
        default: '30'
      max_attempts:
        description: 'Max attempts'
        required: false
        default: '5'

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Append or replace item in watchlist
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          CHANNEL_ID: ${{ github.event.inputs.channel_id }}
          TITLE_KEYWORD: ${{ github.event.inputs.title_keyword }}
          START_TIME: ${{ github.event.inputs.start_time_iran }}
          CHECK_EVERY: ${{ github.event.inputs.check_every_minutes }}
          MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts }}
        run: |
          set -e
          TARGET=config/watchlist.json
          mkdir -p config
          NEW_ITEM=$(jq -n \
            --arg platform "$PLATFORM" \
            --arg cid "$CHANNEL_ID" \
            --arg kw "$TITLE_KEYWORD" \
            --arg start "$START_TIME" \
            --argjson every "${CHECK_EVERY:-30}" \
            --argjson max "${MAX_ATTEMPTS:-5}" \
            '{platform:$platform, channel_id:$cid, title_keyword:$kw, start_time_iran:$start, check_every_minutes:$every, max_attempts:$max}')

          if [ ! -f "$TARGET" ]; then
            echo "[]" > "$TARGET"
          fi

          # remove existing same platform+keyword then append
          jq --arg platform "$PLATFORM" --arg kw "$TITLE_KEYWORD" \
            'map(select(.platform != $platform or .title_keyword != $kw))' "$TARGET" > tmp.json
          jq --argjson item "$NEW_ITEM" '. + [$item]' tmp.json > "$TARGET"
          rm -f tmp.json

          echo "محتویات نهایی config/watchlist.json:"
          cat "$TARGET"

      - name: Commit updated watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/watchlist.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add/replace watch item via form"
            git pull --rebase origin main || true
            git push origin main
          fi
