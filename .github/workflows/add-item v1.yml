name: Add Watch Item v.2➕✅

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '🌐 پلتفرم'
        required: true
        type: choice
        default: 'youtube'
        options:
          - 'youtube'
          - 'soundcloud_playlist'
      channel_id:
        description: 'شناسه کانال یوتیوب (UC...) / لینک پلی‌لیست ساندکلاد'
        required: true
        type: string
      title_keyword:
        description: 'کلیدواژه ثابت در عنوان ویدیو/آهنگ'
        required: true
        type: string
      start_time_iran:
        description: 'ساعت شروع به وقت ایران (HH:MM)'
        required: true
        type: string
        default: '19:00'
      check_every_minutes:
        description: 'فاصلهٔ بین تلاش‌ها (دقیقه)'
        required: false
        type: number
        default: 60
      max_attempts:
        description: 'حداکثر تلاش در روز'
        required: false
        type: number
        default: 5

jobs:
  add:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Append or replace item in watchlist
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          CHANNEL_ID: ${{ github.event.inputs.channel_id }}
          TITLE_KEYWORD: ${{ github.event.inputs.title_keyword }}
          START_TIME: ${{ github.event.inputs.start_time_iran }}
          INTERVAL: ${{ github.event.inputs.check_every_minutes }}
          ATTEMPTS: ${{ github.event.inputs.max_attempts }}
        run: |
          mkdir -p config
          NEW_ITEM=$(jq -n \
            --arg platform "$PLATFORM" \
            --arg cid "$CHANNEL_ID" \
            --arg kw "$TITLE_KEYWORD" \
            --arg st "$START_TIME" \
            --argjson iv "$INTERVAL" \
            --argjson ma "$ATTEMPTS" \
            '{platform: $platform, channel_id: $cid, title_keyword: $kw, start_time_iran: $st, check_every_minutes: $iv, max_attempts: $ma}')

          TARGET=config/watchlist.json
          if [ ! -f "$TARGET" ]; then
            echo "[$NEW_ITEM]" > "$TARGET"
          else
            jq --arg platform "$PLATFORM" --arg kw "$TITLE_KEYWORD" \
              'map(select(.platform != $platform or .title_keyword != $kw))' "$TARGET" > tmp.json
            jq ". += [$NEW_ITEM]" tmp.json > "$TARGET"
            rm tmp.json
          fi
          # Keep root copy in sync for scanner/debug scripts (still use root paths)
          cp "$TARGET" watchlist.json
          echo "محتویات نهایی config/watchlist.json:"
          cat "$TARGET"

      - name: Commit updated watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/watchlist.json watchlist.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add/replace watch item via form"
            git push
          fi
